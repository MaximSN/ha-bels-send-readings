submit_readings:
  name: Отправить показания
  description: Отправляет показания выбранных сенсоров или переданные вручную значения. Если значения не переданы, используются сенсоры из настроек интеграции.
  fields:
    date:
      name: Дата
      description: Дата показаний в формате ГГГГ-ММ-ДД. По умолчанию используется текущая дата по Москве.
      example: "2026-11-20"
      selector:
        date:
    day:
      name: День
      description: Ручное значение дневных показаний. Если не указано, используется выбранный сенсор.
      example: 12500
      selector:
        number:
          min: 0
          mode: box
    night:
      name: Ночь
      description: Ручное значение ночных показаний. Пустое значение не отправляет ночное показание.
      example: 4500
      selector:
        number:
          min: 0
          mode: box
    peak:
      name: Пик
      description: Ручное значение пиковых показаний. Пустое значение не отправляет пиковое показание.
      example: 3200
      selector:
        number:
          min: 0
          mode: box
